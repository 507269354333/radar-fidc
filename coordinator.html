<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar FIDC · Coordenador</title><style>
:root{--bg:#0b1722;--card:#122434;--line:#253b4c;--text:#f5f7f8;--muted:#8fa0ad;--cyan:#35c6d4;--max:1080px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;line-height:1.45}a{color:inherit;text-decoration:none}.wrap{max-width:var(--max);margin:auto;padding:0 24px}.top{border-bottom:1px solid var(--line);background:#0e1d2a}.nav{height:70px;display:flex;align-items:center;gap:16px}.brand{font-weight:900;font-size:20px}.brand b,.tag{color:var(--cyan)}.back{margin-left:auto;color:var(--muted)}.hero{padding:40px 0 22px}.hero h1{font-size:clamp(34px,6vw,56px);line-height:1.05;margin:8px 0}.tag{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.1em}.muted{color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi,.panel,.offer{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:18px}.kpi strong{display:block;font-size:26px;margin:5px 0}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:14px;margin-top:14px}.chart{height:230px;display:flex;align-items:end;gap:8px;border-bottom:1px solid var(--line)}.col{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:5px}.col i{display:block;width:min(32px,75%);background:var(--cyan);border-radius:6px 6px 0 0;min-height:2px}.col small{font-size:9px;color:var(--muted)}.marketrow{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.offers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.offer strong{display:block}.badge{display:inline-block;margin-top:8px;border:1px solid #345369;border-radius:99px;padding:4px 8px;font-size:10px}.section{padding:22px 0 38px}@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.grid,.offers{grid-template-columns:1fr}.wrap{padding:0 18px}.hero h1{font-size:38px}}
</style></head><body><header class="top"><div class="wrap nav"><div class="brand">RADAR <b>FIDC</b></div><span class="tag">League table</span><a class="back" id="back" href="/markets.html">← mercado</a></div></header><main><section class="hero"><div class="wrap"><div class="tag" id="market">—</div><h1 id="name">Carregando coordenador…</h1><p class="muted" id="cnpj"></p></div></section><section class="section"><div class="wrap"><div class="kpis"><div class="kpi"><div class="tag">Ofertas 12m</div><strong id="offers12">—</strong><span class="muted">nesta vertical</span></div><div class="kpi"><div class="tag">Volume 12m</div><strong id="volume12">—</strong><span class="muted">valor observado</span></div><div class="kpi"><div class="tag">Ticket médio</div><strong id="ticket">—</strong><span class="muted">ofertas com valor</span></div><div class="kpi"><div class="tag">Cobertura</div><strong id="coverage">—</strong><span class="muted">mercados com registros</span></div></div><div class="grid"><div class="panel"><div class="tag">Trajetória</div><h2>Atividade mensal</h2><div class="chart" id="chart"></div></div><div class="panel"><div class="tag">Presença</div><h2>FIDC · FIAGRO · FII</h2><div id="markets"></div></div></div></div></section><section class="section"><div class="wrap"><div class="tag">Histórico oficial</div><h2>Ofertas recentes</h2><div class="offers" id="recent">Carregando…</div></div></section></main><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>Number.isFinite(v)?new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',notation:'compact',maximumFractionDigits:1}).format(v):'—',dateBR=v=>{let m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:'—'};const q=new URLSearchParams(location.search),market=(q.get('market')||'FIDC').toUpperCase(),cnpj=q.get('cnpj')||'',name=q.get('name')||'';
async function load(){let u=`/api/coordinator?market=${encodeURIComponent(market)}&${cnpj?'cnpj='+encodeURIComponent(cnpj):'name='+encodeURIComponent(name)}`,r=await fetch(u),d=await r.json();if(!r.ok)throw Error(d.error);document.title=`Radar ${market} · ${d.name}`;$('#market').textContent=market;$('#name').textContent=d.name;$('#cnpj').textContent=d.cnpj||'CNPJ não informado';$('#back').href=`/markets.html?market=${market}`;let s=d.stats12m||{};$('#offers12').textContent=(s.offers||0).toLocaleString('pt-BR');$('#volume12').textContent=money(s.volume);$('#ticket').textContent=money(s.averageTicket);$('#coverage').textContent=(d.byMarket||[]).filter(x=>x.count>0).length;let rows=d.byMonth||[],mx=Math.max(1,...rows.map(x=>x.count));$('#chart').innerHTML=rows.map(x=>`<div class="col" title="${x.month}: ${x.count} ofertas · ${money(x.volume)}"><b>${x.count}</b><i style="height:${Math.max(3,x.count/mx*88)}%"></i><small>${x.month.slice(5)}/${x.month.slice(2,4)}</small></div>`).join('')||'<span class="muted">Sem série mensal.</span>';$('#markets').innerHTML=(d.byMarket||[]).map(x=>`<a class="marketrow" href="/coordinator.html?market=${x.market}&${d.cnpj?'cnpj='+encodeURIComponent(d.cnpj):'name='+encodeURIComponent(d.name)}"><span>${x.market}</span><span><b>${x.count}</b> · ${money(x.volume)}</span></a>`).join('');$('#recent').innerHTML=(d.recentOffers||[]).map(x=>`<a class="offer" href="/offer.html?market=${market}&id=${encodeURIComponent(x.id)}"><div class="tag">${dateBR(x.date)}</div><strong>${esc(x.name)}</strong><span class="muted">${money(x.volume)}</span><br><span class="badge">${esc(x.status||'status não informado')}</span></a>`).join('')||'Sem ofertas.'}
load().catch(e=>{$('#name').textContent='Coordenador indisponível';$('#cnpj').textContent=e.message});
</script></body></html>
