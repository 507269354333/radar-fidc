<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar Semanal</title><meta name="author" content="Daniel Alves Sousa"><link rel="stylesheet" href="/report-theme.css"></head><body><main class="report"><div class="toolbar"><div class="brand">RADAR <b>FIDC</b> · Research</div><div class="actions"><select class="select" id="market"><option>FIDC</option><option>FIAGRO</option><option>FII</option><option value="ALL">GLOBAL</option></select><a class="btn" href="/research.html">Biblioteca</a><button class="btn primary" onclick="window.print()">Salvar PDF</button></div></div><div id="content">Carregando research...</div></main><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>Number.isFinite(v)?new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',notation:'compact',maximumFractionDigits:1}).format(v):'—',pct=v=>Number.isFinite(v)?(v>=0?'+':'')+v.toFixed(1).replace('.',',')+'%':'—',dateBR=v=>{let m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+'/'+m[2]+'/'+m[1]:'—'};
const q=new URLSearchParams(location.search);$('#market').value=(q.get('market')||'FIDC').toUpperCase()==='ALL'?'ALL':(q.get('market')||'FIDC').toUpperCase();
async function getWeekly(m){for(const u of ['/data/weekly-'+m+'.json','/api/weekly?market='+m]){try{let r=await fetch(u,{cache:'default'});if(r.ok){let d=await r.json();if(!d.error)return d}}catch{}}throw Error('Relatório indisponível')}
function groupOffers(rows){const map=new Map();for(const x of rows||[]){const k=(x.name||'').trim(),g=map.get(k)||{name:k,leader:x.leader,total:0,records:[]};if(Number.isFinite(x.volume))g.total+=x.volume;g.records.push(x);map.set(k,g)}return[...map.values()].sort((a,b)=>b.total-a.total)}
function headline(m,d){let c=d.changes||{},label=m==='ALL'?'mercado estruturado':m;if(c.offersPct>0&&c.volumePct<0)return 'Mais operações, menor volume: seletividade segue relevante.';if(c.offersPct>0&&c.volumePct>0)return 'Atividade e volume avançam na semana.';if(c.offersPct<0&&c.volumePct>0)return 'Menos operações, tickets maiores.';return 'Uma semana de leitura seletiva para '+label+'.'}
function hist(d){let w=d.history?.weeks||[];if(!w.length)return '<p class="muted">Histórico semanal será preenchido na próxima atualização.</p>';let max=Math.max(1,...w.map(x=>x.volume||0));return '<div class="history">'+w.map((x,i)=>'<div class="col '+(i===w.length-1?'current':'')+'"><div class="val">'+money(x.volume)+'</div><div class="bar" style="height:'+Math.max(3,(x.volume||0)/max*92)+'px"></div><div class="lbl">'+dateBR(x.period?.end)+'</div></div>').join('')+'</div>'}
function signal(label,value,delta){let cls=Number(delta)>0?'up':Number(delta)<0?'down':'flat';return '<div class="kpi"><div class="label">'+esc(label)+'</div><strong>'+esc(value)+'</strong><small class="delta '+cls+'">'+esc(pct(delta))+'</small></div>'}
function indexRows(intel,market){let d=(intel?.directions||[]).find(x=>x.market===market)||(market==='ALL'?null:null);if(!d)return '';return Object.entries(d.scores||{}).map(([k,v])=>'<div class="index-row"><b>'+esc(k)+'</b><div><div class="meter"><i style="width:'+(Number.isFinite(v)?v:0)+'%"></i></div><small class="muted">'+esc(d.statement)+'</small></div><span class="score">'+(Number.isFinite(v)?v.toFixed(0):'—')+'</span></div>').join('')}
function render(d,m){let c=d.current||{},p=d.prior||{},b=d.benchmarks?.prior4Average||{},v4=d.benchmarks?.currentVsPrior4Average||{},intel=d.intelligence||{},ops=groupOffers(c.topOffers||[]).slice(0,3),label=m==='ALL'?'GLOBAL':m,top=c.topLeaders?.[0],thesis=(intel.theses||[])[0];
document.title='Radar Semanal '+label+' · '+dateBR(c.period?.end);
$('#content').innerHTML=
'<section class="page cover"><div><div class="eyebrow">RADAR SEMANAL · '+esc(label)+'</div><h1>'+esc(headline(m,d))+'</h1><p class="dek">Ofertas públicas em destaque, contraste histórico, condições de mercado e implicações para a próxima semana. O portal mantém a base completa; este material seleciona apenas o que muda a leitura.</p><div class="cover-meta"><div class="meta"><span>Semana</span><b>'+dateBR(c.period?.start)+' - '+dateBR(c.period?.end)+'</b></div><div class="meta"><span>Ofertas</span><b>'+(c.offers??'—')+'</b></div><div class="meta"><span>Volume registrado</span><b>'+money(c.volume)+'</b></div></div></div><div class="cover-bottom"><div><strong>Daniel Alves Sousa</strong><br>Radar FIDC · Research independente</div><div>Dado oficial → leitura → implicação</div></div></section>'+
'<section class="page"><div class="section-title"><h2>Pulso da semana</h2><p>A comparação usa semana anterior e média das quatro semanas completas anteriores.</p></div><div class="kpis">'+signal('Ofertas',String(c.offers??'—'),d.changes?.offersPct)+signal('Volume',money(c.volume),d.changes?.volumePct)+signal('vs. média 4 semanas',money(b.volume),v4.volumePct)+signal('Coordenadores',String(c.leaders??'—'),null)+'</div><div class="grid2" style="margin-top:14px"><div class="panel"><div class="tag">Contraste histórico</div><h3>8 semanas de volume registrado</h3>'+hist(d)+'</div><div class="panel soft"><div class="tag">Leitura Radar</div><h3>'+esc(thesis?.title||headline(m,d))+'</h3><p>'+esc(thesis?.statement||(d.observations||[])[0]||'Sem leitura adicional.')+'</p><div class="callout"><strong>Semana x média 4 semanas</strong>Quantidade '+pct(v4.offersPct)+' · Volume '+pct(v4.volumePct)+'</div></div></div><div class="grid2" style="margin-top:14px"><div class="panel"><div class="tag">Estrutura do mercado</div><h3>'+esc(top?.name||'Sem líder identificado')+'</h3><p class="muted">'+(top?'Liderou por quantidade com '+top.count+' registro(s). ':'')+'Top 3 concentraram '+(Number.isFinite(c.top3Concentration)?(c.top3Concentration*100).toFixed(1).replace('.',',')+'%':'—')+' das ofertas.</p></div><div class="panel"><div class="tag">Público-alvo</div><h3>'+(Number.isFinite(c.professionalShare)?(c.professionalShare*100).toFixed(1).replace('.',',')+'%':'—')+'</h3><p class="muted">Parcela destinada a investidores profissionais segundo o campo oficial da oferta.</p></div></div><div class="footer-mark"><span>RADAR '+esc(label)+' · Semanal</span><span>02 · Pulso</span></div></section>'+
'<section class="page"><div class="section-title"><h2>Destaques de ofertas públicas</h2><p>Somente operações que merecem atenção editorial. A relação completa permanece no portal.</p></div><div class="panel">'+(ops.length?ops.map((g,i)=>'<article class="offer-card"><div class="offer-head"><div class="offer-rank">'+(i+1)+'</div><div><h3>'+esc(g.name)+'</h3><div class="muted">'+esc(g.leader||'Coordenador não informado')+' · '+g.records.length+' registro(s)</div></div><div class="volume">'+money(g.total)+'</div></div><div class="chips">'+g.records.slice(0,4).map(x=>'<span class="chip">'+esc(x.registration||x.processNumber||'registro')+' · '+dateBR(x.date)+'</span>').join('')+'</div></article>').join(''):'<p class="muted">Nenhuma oferta com volume positivo para destaque nesta semana.</p>')+'</div><div class="grid2" style="margin-top:14px"><div class="panel soft"><div class="tag">O que observar</div><ul class="list">'+(d.observations||[]).slice(0,4).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><div class="panel soft"><div class="tag">Temas indicativos</div>'+(c.themeSignals||[]).slice(0,4).map(x=>'<p><b>'+esc(x.name)+'</b> <span class="muted">· '+x.count+' ocorrência(s)</span></p>').join('')+'<small class="muted">Temas derivados da denominação; não substituem prospecto ou documento da oferta.</small></div></div><div class="footer-mark"><span>RADAR '+esc(label)+' · Semanal</span><span>03 · Ofertas em destaque</span></div></section>'+
'<section class="page"><div class="section-title"><h2>Inteligência, funding e regulação</h2><p>O fechamento transforma os dados da semana em agenda para a próxima.</p></div><div class="grid2"><div class="panel dark"><div class="tag">Tese Radar</div><h3>'+esc(thesis?.title||'Leitura em atualização')+'</h3><p>'+esc(thesis?.statement||'A inteligência da semana será atualizada com a próxima competência.')+'</p></div><div class="panel"><div class="tag">O que invalida a tese</div><ul class="list">'+(thesis?.invalidates||[]).slice(0,3).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></div><div class="grid2" style="margin-top:14px"><div class="panel"><div class="tag">Funding & crédito</div><p><b>Selic:</b> '+esc(d.macro?.selic?.latest?.value??'—')+' '+esc(d.macro?.selic?.unit||'')+'</p><p><b>Spread PJ:</b> '+esc(d.macro?.spreadPJ?.latest?.value??'—')+' '+esc(d.macro?.spreadPJ?.unit||'')+'</p><p><b>Inadimplência PJ:</b> '+esc(d.macro?.inadPJ?.latest?.value??'—')+' '+esc(d.macro?.inadPJ?.unit||'')+'</p></div><div class="panel"><div class="tag">Regulador em foco</div>'+(d.regulatoryHighlights||[]).slice(0,2).map(x=>'<p><b>'+esc(x.title)+'</b><br><span class="muted">CVM · fonte oficial</span></p>').join('')+'</div></div><div class="callout amber" style="margin-top:14px"><strong>Agenda da próxima semana</strong>Monitorar novas ofertas, alterações de status, documentação das operações em destaque e publicações da CVM/ANBIMA que alterem rito, responsabilidade ou evidência operacional.</div><p class="source"><b>Metodologia.</b> '+esc(d.methodology||'')+'<br><b>Fontes.</b> CVM Dados Abertos; Banco Central/SGS; ANBIMA; publicações oficiais da CVM. Volume registrado não equivale a captação efetiva.</p><div class="footer-mark"><span>RADAR '+esc(label)+' · Semanal</span><span>04 · Fechamento</span></div></section>'}
async function load(){try{let m=$('#market').value,d=await getWeekly(m);history.replaceState(null,'','?market='+m);render(d,m)}catch(e){$('#content').innerHTML='<section class="page"><h1>Relatório indisponível</h1><p>'+esc(e.message)+'</p></section>'}}
$('#market').addEventListener('change',load);load();
</script></body></html>
