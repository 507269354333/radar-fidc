<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar FIDC · Relatório semanal</title><style>
:root{--bg:#0b1722;--card:#122434;--line:#253b4c;--text:#f5f7f8;--muted:#8fa0ad;--cyan:#35c6d4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;line-height:1.45}.page{max-width:980px;margin:auto;padding:34px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{font-weight:900;font-size:22px}.brand b,.tag{color:var(--cyan)}h1{font-size:44px;line-height:1;margin:18px 0 8px}h2{margin:0 0 12px}h3{margin:8px 0}.muted,.source{color:var(--muted)}.tag{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.select{border:1px solid var(--cyan);background:#102b34;color:var(--cyan);border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.select{color:#fff;border-color:var(--line);background:#0e2231}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.kpi,.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.kpi strong{display:block;font-size:26px;margin:6px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.rank{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.bar{height:5px;background:#1a3547;border-radius:5px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--cyan)}.insights{padding-left:18px}.insights li{margin:0 0 10px}.offer{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.offer small{display:block;color:var(--muted)}.reg{display:block;padding:10px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.macro .box strong{font-size:20px}.source{font-size:11px;margin-top:20px}.loading{padding:40px 0}.theme{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.page-break{height:0}.compare-week{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.compare-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.compare-bars{display:grid;gap:8px;margin-top:12px}.compare-row{display:grid;grid-template-columns:62px 1fr auto;gap:9px;align-items:center;font-size:11px}.compare-track{height:8px;background:#1a3547;border-radius:8px;overflow:hidden}.compare-track i{display:block;height:100%;background:var(--cyan)}.compare-row.prior .compare-track i{background:#5f7380}.offer-group{padding:12px 0;border-bottom:1px solid var(--line);break-inside:avoid}.offer-head{display:grid;grid-template-columns:1fr auto;gap:12px}.offer-head strong{font-size:14px}.components{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.component{font-size:10px;border:1px solid var(--line);border-radius:99px;padding:4px 7px;color:#b8c5cd}.watch-list{display:grid;gap:10px}.watch-item{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);break-inside:avoid}.watch-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#103442;color:var(--cyan);font-weight:900}.watch-item p{margin:3px 0 0;color:var(--muted);font-size:12px}.macro .origin{display:block;color:var(--muted);font-size:10px;margin-top:5px}.research-note{border-left:3px solid var(--cyan);padding:10px 12px;background:#0e2231;border-radius:0 12px 12px 0;color:#c1ced5;font-size:12px}@media(max-width:760px){.page{padding:22px}.top{display:block}.actions{margin-top:14px}.grid4,.grid2,.macro{grid-template-columns:1fr 1fr}h1{font-size:36px}}@media print{body{background:#fff;color:#111}.page{max-width:none;padding:0}.actions{display:none}.kpi,.box,.compare-card{background:#fff;border-color:#bbb;break-inside:avoid;page-break-inside:avoid}.grid2,.grid4,.macro,.offer-group,.reg,.watch-item{break-inside:avoid;page-break-inside:avoid}.page-break{break-before:page;page-break-before:always}.muted,.source,.component{color:#555}.brand b,.tag{color:#087b88}.bar,.compare-track{background:#ddd}.bar i,.compare-track i{background:#087b88}.compare-row.prior .compare-track i{background:#aaa}a{color:#111}.top{border-color:#bbb}.research-note{background:#f4f7f8;color:#333;border-left-color:#087b88}@page{size:A4;margin:12mm}}
</style></head><body><main class="page"><div class="top"><div><div class="brand">RADAR <b>FIDC</b></div><div class="tag">Inteligência de mercado · relatório semanal</div></div><div class="actions"><select class="select" id="market"><option>FIDC</option><option>FIAGRO</option><option>FII</option><option value="ALL">3 mercados</option></select><button class="btn" onclick="window.print()">Salvar / imprimir PDF</button></div></div><div id="content" class="loading">Gerando relatório com dados oficiais…</div></main><script>
const $=s=>document.querySelector(s),money=v=>Number.isFinite(v)?new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',notation:'compact',maximumFractionDigits:1}).format(v):'—',num=v=>Number(v).toLocaleString('pt-BR',{maximumFractionDigits:2}),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dateBR=v=>{let m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:'—'},pct=v=>Number.isFinite(v)?`${v>=0?'+':''}${v.toFixed(1).replace('.',',')}%`:'sem base comparável';const qs=new URLSearchParams(location.search);$('#market').value=(qs.get('market')||'FIDC').toUpperCase();
function macroCard(label,z,fallback=null){let latest=z?.latest,value=latest?.value,unit=z?.unit||'',origin='BCB / SGS';if(!latest&&fallback?.value!=null){latest={date:fallback.date||''};value=fallback.value;unit=fallback.unit||'';origin='ANBIMA · Selic BCB (fallback)'}let change=z?.latest&&z?.previous?z.latest.value-z.previous.value:null;return `<div class="box"><div class="tag">${esc(label)}</div><strong>${Number.isFinite(value)?num(value)+' '+esc(unit):'—'}</strong><span class="muted">${latest?.date||'indisponível'}${Number.isFinite(change)?' · '+(change>=0?'+':'')+num(change)+' vs. anterior':''}</span><span class="origin">${esc(origin)}</span></div>`}
function groupOffers(rows){const map=new Map();for(const x of rows||[]){const key=(x.name||'').trim();const g=map.get(key)||{name:key,leader:x.leader,total:0,records:[]};if(Number.isFinite(x.volume))g.total+=x.volume;g.records.push(x);map.set(key,g)}return[...map.values()].sort((a,b)=>b.total-a.total)}
function weeklyHeadline(market,changes){if(changes?.offersPct>0&&changes?.volumePct<0)return `${market}: mais registros, menor volume semanal.`;if(changes?.offersPct>0&&changes?.volumePct>0)return `${market}: atividade e volume avançam na semana.`;if(changes?.offersPct<0&&changes?.volumePct>0)return `${market}: menos registros, tickets maiores.`;return `${market}: leitura da semana.`}
function compareWeek(c,p){const maxOffers=Math.max(1,c?.offers||0,p?.offers||0),maxVolume=Math.max(1,c?.volume||0,p?.volume||0);return `<div class="compare-week"><div class="compare-card"><div class="tag">Quantidade</div><h3>Ofertas: ${c.offers||0} vs. ${p.offers||0}</h3><div class="compare-bars"><div class="compare-row prior"><span>Anterior</span><div class="compare-track"><i style="width:${(p.offers||0)/maxOffers*100}%"></i></div><b>${p.offers||0}</b></div><div class="compare-row"><span>Atual</span><div class="compare-track"><i style="width:${(c.offers||0)/maxOffers*100}%"></i></div><b>${c.offers||0}</b></div></div></div><div class="compare-card"><div class="tag">Volume</div><h3>${money(c.volume)} · ${pct((c.volume&&p.volume)?(c.volume-p.volume)/p.volume*100:null)} vs. anterior</h3><div class="compare-bars"><div class="compare-row prior"><span>Anterior</span><div class="compare-track"><i style="width:${(p.volume||0)/maxVolume*100}%"></i></div><b>${money(p.volume)}</b></div><div class="compare-row"><span>Atual</span><div class="compare-track"><i style="width:${(c.volume||0)/maxVolume*100}%"></i></div><b>${money(c.volume)}</b></div></div></div></div>`}
function watchItems(d){const c=d.current||{},ch=d.changes||{},leaders=c.topLeaders||[],ops=groupOffers(c.topOffers||[]),items=[];if(Number.isFinite(ch.offersPct)&&Number.isFinite(ch.volumePct)&&ch.offersPct>0&&ch.volumePct<0)items.push(['Ritmo x volume',`A quantidade de registros acelerou, mas o volume caiu ${Math.abs(ch.volumePct).toFixed(1).replace('.',',')}%. Acompanhar se a pulverização de tickets continua.`]);if(leaders[0])items.push(['Liderança e concentração',`${leaders[0].name} liderou com ${leaders[0].count} registros; os três mais presentes concentraram ${Number.isFinite(c.top3Concentration)?(c.top3Concentration*100).toFixed(1).replace('.',','):'—'}% das ofertas.`]);if(ops[0])items.push(['Documentos da maior operação',`${ops[0].name} somou ${money(ops[0].total)} nos registros observados. Tese ou destinação só entram no Radar quando houver documento público que sustente a leitura.`]);items.push(['SRE / CVM','Acompanhar novas orientações sobre ofertas e coordenadores e relacioná-las às operações somente quando houver conexão objetiva.']);if(d.macro?.spreadPJ?.latest&&d.macro?.inadPJ?.latest)items.push(['Funding e crédito',`Spread PJ em ${num(d.macro.spreadPJ.latest.value)} p.p. e inadimplência PJ em ${num(d.macro.inadPJ.latest.value)}%. Monitorar a evolução do custo e da qualidade do crédito.`]);return items.slice(0,5)}
async function getWeekly(market){for(const url of [`/data/weekly-${market}.json`,`/api/weekly?market=${market}`]){try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),url.startsWith('/api/')?40000:5000),r=await fetch(url,{cache:url.startsWith('/data/')?'no-cache':'default',signal:controller.signal});clearTimeout(timer);if(!r.ok)continue;const d=await r.json();if(!d.error)return d}catch{}}throw Error('Relatório temporariamente indisponível. Tente novamente em instantes.')}async function load(){try{let market=$('#market').value,d=await getWeekly(market);let c=d.current||{},ch=d.changes||{},top=c.topLeaders?.[0],mx=Math.max(1,...(c.topLeaders||[]).map(x=>x.count)),a=d.anbima||{},label=market==='ALL'?'FIDC + FIAGRO + FII':market;document.title=`Radar ${label} · ${dateBR(c.period?.start)} a ${dateBR(c.period?.end)}`;$('#content').className='';$('#content').innerHTML=`<h1>${esc(weeklyHeadline(label,ch))}</h1><p class="muted">${dateBR(c.period?.start)} a ${dateBR(c.period?.end)} · fechamento de segunda a domingo</p><div class="grid4"><div class="kpi"><div class="tag">Ofertas</div><strong>${c.offers??'—'}</strong><span class="muted">${pct(ch.offersPct)} vs. anterior</span></div><div class="kpi"><div class="tag">Volume</div><strong>${money(c.volume)}</strong><span class="muted">${c.offersWithVolume||0} com valor · ${pct(ch.volumePct)} vs. anterior</span></div><div class="kpi"><div class="tag">Coordenadores</div><strong>${c.leaders??'—'}</strong><span class="muted">distintos</span></div><div class="kpi"><div class="tag">Líder</div><strong>${top?.count??'—'}</strong><span class="muted">${esc(top?.name||'—')}</span></div></div>${compareWeek(c,d.prior||{})}<div class="grid2"><section class="box"><div class="tag">Leitura Radar</div><h2>O que os dados estão dizendo</h2><ul class="insights">${(d.observations||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="box"><div class="tag">Sinais de tese</div><h2>Temas da semana</h2><p class="muted">Indicativos por denominação; não substituem prospectos ou documentos da oferta.</p>${(c.themeSignals||[]).map(x=>`<div class="theme"><span>${esc(x.name)}</span><b>${x.count}</b></div>`).join('')||'Nenhum tema detectado.'}</section></div><div class="page-break"></div><div class="grid2"><section class="box"><div class="tag">Ranking</div><h2>Coordenadores líderes</h2>${(c.topLeaders||[]).slice(0,8).map((x,i)=>`<div class="rank"><b>${i+1}</b><div>${esc(x.name)}<div class="bar"><i style="width:${x.count/mx*100}%"></i></div></div><b>${x.count}</b></div>`).join('')||'Sem registros.'}</section><section class="box"><div class="tag">Operações</div><h2>Maiores ofertas</h2>${groupOffers(c.topOffers||[]).slice(0,8).map(g=>`<div class="offer-group"><div class="offer-head"><div><b>${esc(g.name)}</b><small class="muted">${esc(g.leader||'Coordenador não informado')} · ${g.records.length} registro(s)</small></div><strong>${money(g.total)}</strong></div><div class="components">${g.records.map(x=>`<span class="component">Reg. ${esc(x.registration||x.processNumber||'—')} · ${money(x.volume)} · ${dateBR(x.date)}</span>`).join('')}</div></div>`).join('')||'Sem ofertas com volume positivo.'}</section></div><div class="page-break"></div><div class="grid2"><section class="box"><div class="tag">Regulador</div><h2>CVM em foco</h2>${(d.regulatoryHighlights||[]).slice(0,4).map(x=>`<a class="reg" href="${esc(x.url)}"><b>${esc(x.title)}</b><br><span class="muted">Fonte oficial CVM</span></a>`).join('')||'Nenhum destaque capturado.'}</section><section class="box"><div class="tag">Comparação</div><h2>3 mercados</h2>${(d.marketComparison||[]).map(x=>`<div class="theme"><span>${esc(x.market)} · ${x.offersInMonth} ofertas</span><b>${money(x.volumeInMonth)}</b></div>`).join('')}</section></div><section><div class="tag">Crédito & funding</div><h2>Contexto macro</h2><div class="macro">${macroCard('Selic',d.macro?.selic,a.selicBc||a.selicEstimate)}${macroCard('Inadimplência PJ',d.macro?.inadPJ)}${macroCard('Spread PJ',d.macro?.spreadPJ)}${macroCard('Saldo de crédito PJ',d.macro?.estoquePJ)}</div></section><section style="margin-top:18px"><div class="tag">ANBIMA</div><h2>Quadro de indicadores</h2><div class="macro"><div class="box"><strong>${a.selicEstimate?.value!=null?num(a.selicEstimate.value)+'%':'—'}</strong><span class="muted">Estimativa Selic</span></div><div class="box"><strong>${a.dollarSell?.value!=null?'R$ '+num(a.dollarSell.value):'—'}</strong><span class="muted">Dólar venda</span></div><div class="box"><strong>${a.ipcaProjection?.value!=null?num(a.ipcaProjection.value)+'%':'—'}</strong><span class="muted">IPCA projetado</span></div><div class="box"><strong>${a.diB3?.value!=null?num(a.diB3.value)+'%':'—'}</strong><span class="muted">DI-B3</span></div></div></section><div class="page-break"></div><section class="box"><div class="tag">Radar da próxima semana</div><h2>O que acompanhar agora</h2><p class="muted">Agenda de monitoramento baseada nos dados encerrados. Não é previsão.</p><div class="watch-list">${watchItems(d).map((x,i)=>`<div class="watch-item"><div class="watch-num">${i+1}</div><div><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div></div>`).join('')}</div></section><div class="grid2" style="margin-top:14px"><section class="box"><div class="tag">Princípio editorial</div><h3>Três camadas, sempre separadas</h3><div class="theme"><span>Dado oficial</span><b>CVM · BCB · ANBIMA</b></div><div class="theme"><span>Documento da operação</span><b>Prospecto · anúncio</b></div><div class="theme"><span>Leitura Radar</span><b>Interpretação identificada</b></div></section><section class="box"><div class="tag">Uso responsável</div><div class="research-note">O Radar não atribui finalidade, tese ou destinação a uma oferta sem documento público que sustente a afirmação.</div></section></div><p class="source"><b>Metodologia.</b> ${esc(d.methodology||'')}<br><b>Fontes:</b> CVM Dados Abertos; Banco Central do Brasil / SGS; ANBIMA — Quadro de Indicadores; notícias oficiais da CVM. Gerado em ${new Date(d.generatedAt).toLocaleString('pt-BR')}.</p>`}catch(e){$('#content').innerHTML=`<h1>Relatório indisponível</h1><p>${esc(e.message)}</p>`}}
$('#market').addEventListener('change',()=>{history.replaceState(null,'',`?market=${$('#market').value}`);$('#content').className='loading';$('#content').textContent='Atualizando relatório…';load()});load();
</script></body></html>
