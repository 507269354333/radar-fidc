<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar FIDC · Relatório semanal</title><style>
:root{--bg:#0b1722;--card:#122434;--line:#253b4c;--text:#f5f7f8;--muted:#8fa0ad;--cyan:#35c6d4;--green:#42d6a4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;line-height:1.45}.page{max-width:980px;margin:auto;padding:34px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{font-weight:900;font-size:22px}.brand b,.tag{color:var(--cyan)}h1{font-size:44px;line-height:1;margin:18px 0 8px}h2{margin:0 0 12px}h3{margin:8px 0}.muted,.source{color:var(--muted)}.tag{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.actions{display:flex;gap:8px}.btn{border:1px solid var(--cyan);background:#102b34;color:var(--cyan);border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.kpi,.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.kpi strong{display:block;font-size:26px;margin:6px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.rank{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.bar{height:5px;background:#1a3547;border-radius:5px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--cyan)}.insights{padding-left:18px}.insights li{margin:0 0 10px}.offer{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.offer small{display:block;color:var(--muted)}.reg{display:block;padding:10px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.macro .box strong{font-size:20px}.source{font-size:11px;margin-top:20px}.loading{padding:40px 0}@media(max-width:760px){.page{padding:22px}.top{display:block}.actions{margin-top:14px}.grid4,.grid2,.macro{grid-template-columns:1fr 1fr}h1{font-size:36px}}@media print{body{background:#fff;color:#111}.page{max-width:none;padding:0}.actions{display:none}.kpi,.box{background:#fff;border-color:#bbb}.muted,.source{color:#555}.brand b,.tag{color:#087b88}.bar{background:#ddd}.bar i{background:#087b88}a{color:#111}.top{border-color:#bbb}@page{size:A4;margin:13mm}}
</style></head><body><main class="page"><div class="top"><div><div class="brand">RADAR <b>FIDC</b></div><div class="tag">Inteligência de mercado · relatório semanal</div></div><div class="actions"><button class="btn" onclick="window.print()">Salvar / imprimir PDF</button><button class="btn" onclick="location.reload()">Atualizar</button></div></div><div id="content" class="loading">Gerando relatório com dados oficiais…</div></main><script>
const money=v=>Number.isFinite(v)?new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',notation:'compact',maximumFractionDigits:1}).format(v):'—',num=v=>Number(v).toLocaleString('pt-BR',{maximumFractionDigits:2}),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dateBR=v=>{let m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:'—'},pct=v=>Number.isFinite(v)?`${v>=0?'+':''}${v.toFixed(1).replace('.',',')}%`:'sem base comparável';
function macroCard(label,z){return `<div class="box"><div class="tag">${esc(label)}</div><strong>${z?.latest?num(z.latest.value)+' '+esc(z.unit||''):'—'}</strong><span class="muted">${z?.latest?.date||'indisponível'}</span></div>`}
async function load(){try{let r=await fetch('/api/weekly'),d=await r.json();if(!r.ok)throw Error(d.error);let c=d.current||{},ch=d.changes||{},top=c.topLeaders?.[0],mx=Math.max(1,...(c.topLeaders||[]).map(x=>x.count)),a=d.anbima||{};document.title=`Radar FIDC · ${dateBR(c.period?.start)} a ${dateBR(c.period?.end)}`;document.querySelector('#content').className='';document.querySelector('#content').innerHTML=`<h1>Relatório semanal FIDC</h1><p class="muted">${dateBR(c.period?.start)} a ${dateBR(c.period?.end)} · fechamento de segunda a domingo</p><div class="grid4"><div class="kpi"><div class="tag">Ofertas</div><strong>${c.offers??'—'}</strong><span class="muted">${pct(ch.offersPct)} vs. semana anterior</span></div><div class="kpi"><div class="tag">Volume</div><strong>${money(c.volume)}</strong><span class="muted">${c.offersWithVolume||0} ofertas com valor positivo</span></div><div class="kpi"><div class="tag">Coordenadores</div><strong>${c.leaders??'—'}</strong><span class="muted">distintos no período</span></div><div class="kpi"><div class="tag">Líder</div><strong>${top?.count??'—'}</strong><span class="muted">${esc(top?.name||'—')}</span></div></div><div class="grid2"><section class="box"><div class="tag">Leitura Radar</div><h2>O que os dados estão dizendo</h2><ul class="insights">${(d.observations||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section><section class="box"><div class="tag">Ranking</div><h2>Coordenadores líderes</h2>${(c.topLeaders||[]).slice(0,8).map((x,i)=>`<div class="rank"><b>${i+1}</b><div>${esc(x.name)}<div class="bar"><i style="width:${x.count/mx*100}%"></i></div></div><b>${x.count}</b></div>`).join('')||'Sem registros.'}</section></div><div class="grid2"><section class="box"><div class="tag">Operações</div><h2>Maiores ofertas da semana</h2>${(c.topOffers||[]).slice(0,8).map(x=>`<div class="offer"><div><b>${esc(x.name)}</b><small>${esc(x.leader||'Coordenador não informado')} · ${dateBR(x.date)}</small></div><b>${money(x.volume)}</b></div>`).join('')||'Sem ofertas com volume positivo.'}</section><section class="box"><div class="tag">Regulador</div><h2>CVM em foco</h2>${(d.regulatoryHighlights||[]).slice(0,6).map(x=>`<a class="reg" href="${esc(x.url)}"><b>${esc(x.title)}</b><br><span class="muted">Fonte oficial CVM</span></a>`).join('')||'Nenhum destaque capturado.'}</section></div><section><div class="tag">Crédito & funding</div><h2>Contexto macro</h2><div class="macro">${macroCard('Selic',d.macro?.selic)}${macroCard('Inadimplência PJ',d.macro?.inadPJ)}${macroCard('Spread PJ',d.macro?.spreadPJ)}${macroCard('Saldo de crédito PJ',d.macro?.estoquePJ)}</div></section><section style="margin-top:18px"><div class="tag">ANBIMA</div><h2>Quadro de indicadores</h2><div class="macro"><div class="box"><strong>${a.selicEstimate?.value!=null?num(a.selicEstimate.value)+'%':'—'}</strong><span class="muted">Estimativa Selic</span></div><div class="box"><strong>${a.dollarSell?.value!=null?'R$ '+num(a.dollarSell.value):'—'}</strong><span class="muted">Dólar venda</span></div><div class="box"><strong>${a.ipcaProjection?.value!=null?num(a.ipcaProjection.value)+'%':'—'}</strong><span class="muted">IPCA projetado</span></div><div class="box"><strong>${a.diB3?.value!=null?num(a.diB3.value)+'%':'—'}</strong><span class="muted">DI-B3</span></div></div></section><p class="source"><b>Metodologia.</b> ${esc(d.methodology||'')}<br><b>Fontes:</b> CVM Dados Abertos; Banco Central do Brasil / SGS; ANBIMA — Quadro de Indicadores; notícias oficiais da CVM. Gerado em ${new Date(d.generatedAt).toLocaleString('pt-BR')}.</p>`}catch(e){document.querySelector('#content').innerHTML=`<h1>Relatório indisponível</h1><p>${esc(e.message)}</p>`}}load();
</script></body></html>
