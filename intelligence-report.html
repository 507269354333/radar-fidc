<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar Inteligência</title><link rel="stylesheet" href="/report-theme.css"></head><body><main class="report"><div class="toolbar"><div class="brand">RADAR <b>INTELIGÊNCIA</b></div><div class="actions"><a class="btn" href="/research.html">Biblioteca</a><a class="btn" href="/intelligence.html">Portal</a><button class="btn primary" onclick="window.print()">Salvar PDF</button></div></div><div id="content">Carregando...</div></main><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>Number.isFinite(v)?new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',notation:'compact',maximumFractionDigits:1}).format(v):'—';
async function getData(){let r=await fetch('/data/intelligence.json',{cache:'default'});if(!r.ok)throw Error('Inteligência indisponível');return r.json()}
function idx(code,x){let e=x?.education||{};return '<div class="index-row"><b>'+esc(code)+'</b><div><div class="meter"><i style="width:'+(Number.isFinite(x?.score)?x.score:0)+'%"></i></div><small class="muted">'+esc(e.currentReading||x?.interpretation||'')+'</small></div><span class="score">'+(Number.isFinite(x?.score)?x.score.toFixed(0):'—')+'</span></div>'}
async function load(){try{let d=await getData(),a=d.indices?.markets?.ALL||{},th=(d.theses||[]).slice(0,3);$('#content').innerHTML=
'<section class="page cover"><div><div class="eyebrow">RADAR INTELIGÊNCIA</div><h1>'+esc(d.brief?.headline||'Leitura de mercado')+'</h1><p class="dek">'+esc(d.brief?.summary||'Teses, índices e cenários proprietários com critérios explícitos de confirmação e invalidação.')+'</p><div class="cover-meta"><div class="meta"><span>Teses vivas</span><b>'+th.length+'</b></div><div class="meta"><span>Índices</span><b>5</b></div><div class="meta"><span>Verticais</span><b>FIDC · FIAGRO · FII</b></div></div></div><div class="cover-bottom"><div><strong>Daniel Alves Sousa</strong><br>Radar FIDC · Inteligência de Mercado</div><div>Dado → método → tese → cenário</div></div></section>'+
'<section class="page"><div class="section-title"><h2>Pulso do mercado</h2><p>Os cinco índices são apresentados com leitura, não como números isolados.</p></div><div class="panel">'+idx('IROP',a.offerPressure)+idx('IRBD',a.breadth)+idx('IRCC',a.concentration)+idx('IRFC',a.funding)+idx('IRPM',a.pulse)+'</div><div class="callout" style="margin-top:14px"><strong>Como ler</strong>'+esc(d.indices?.foundation?.caveat||'Índices proprietários em validação histórica contínua; não são índices oficiais nem previsão garantida.')+'</div><div class="footer-mark"><span>RADAR INTELIGÊNCIA</span><span>02 · Índices</span></div></section>'+
'<section class="page"><div class="section-title"><h2>Teses Radar</h2><p>Uma tese só permanece viva enquanto os dados confirmam seu mecanismo.</p></div>'+th.map((t,i)=>'<div class="panel '+(i===0?'dark':'')+'" style="margin-bottom:12px"><div class="tag">Tese '+(i+1)+' · horizonte '+esc(t.horizon)+'</div><h3>'+esc(t.title)+'</h3><p>'+esc(t.statement)+'</p><div class="grid2"><div><b>Confirma</b><ul class="list">'+(t.confirms||[]).slice(0,3).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><div><b>Invalida</b><ul class="list">'+(t.invalidates||[]).slice(0,3).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></div></div>').join('')+'<div class="footer-mark"><span>RADAR INTELIGÊNCIA</span><span>03 · Teses</span></div></section>'+
'<section class="page"><div class="section-title"><h2>Cenários e direção</h2><p>Os cenários anualizam ritmo; não são probabilidades nem promessa de captação.</p></div><div class="grid3">'+(d.scenarios||[]).map(s=>{let base=(s.scenarios||[]).find(x=>x.label==='Base');return '<div class="panel"><div class="tag">'+esc(s.market)+'</div><h3>'+money(base?.volume)+'</h3><p class="muted">'+esc(base?.offers??'—')+' ofertas no cenário-base</p><p>IROP '+(Number.isFinite(s.current?.IROP)?s.current.IROP.toFixed(0):'—')+'/100 · IRPM '+(Number.isFinite(s.current?.IRPM)?s.current.IRPM.toFixed(0):'—')+'/100</p></div>'}).join('')+'</div><div class="panel soft" style="margin-top:14px"><div class="tag">O que muda nossa visão</div><ul class="list">'+(d.brief?.watch||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><p class="source">'+esc(d.methodology||'')+'</p><div class="footer-mark"><span>RADAR INTELIGÊNCIA</span><span>04 · Cenários</span></div></section>'}catch(e){$('#content').innerHTML='<section class="page"><h1>Material indisponível</h1><p>'+esc(e.message)+'</p></section>'}}load();
</script></body></html>
