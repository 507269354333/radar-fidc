<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carta Mensal Radar</title><style>
:root{--bg:#091722;--card:#122635;--card2:#0e202d;--line:#294151;--text:#f4f7f8;--muted:#91a2ae;--cyan:#35c6d4;--green:#45d0a2;--amber:#e9ba63;--red:#ee7a8c;--max:1040px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;line-height:1.5}a{color:inherit}.page{max-width:var(--max);margin:auto;padding:34px}.top{display:flex;justify-content:space-between;gap:22px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-size:22px;font-weight:900}.brand b,.tag{color:var(--cyan)}.tag{font-size:11px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}.actions{display:flex;gap:8px;flex-wrap:wrap}.select,.btn{border:1px solid var(--line);background:var(--card2);color:#fff;border-radius:11px;padding:10px 12px;font-weight:800}.btn{border-color:var(--cyan);color:var(--cyan);cursor:pointer}.cover{padding:42px 0 24px}.cover h1{font-size:clamp(42px,7vw,70px);line-height:.98;margin:10px 0 18px;letter-spacing:-.04em}.cover .lead{font-size:18px;color:#b9c6ce;max-width:820px}.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:22px 0}.kpi,.box,.index-card,.vertical{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.kpi strong,.index-card strong{display:block;font-size:27px;margin:6px 0}.muted{color:var(--muted)}.section{padding:24px 0}.section h2{font-size:32px;margin:0 0 8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.indices{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.index-card{padding:14px}.index-card strong{font-size:25px}.meter{height:6px;background:#1a3544;border-radius:8px;overflow:hidden;margin:10px 0}.meter i{display:block;height:100%;background:var(--cyan)}.formula{font-size:10px;color:var(--muted)}.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.delta{font-size:12px}.positive{color:var(--green)}.negative{color:var(--red)}.rank{display:grid;grid-template-columns:28px 1fr auto;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}.rank small{display:block;color:var(--muted)}.offer{padding:10px 0;border-bottom:1px solid var(--line)}.offer-head{display:grid;grid-template-columns:1fr auto;gap:10px}.offer small{display:block;color:var(--muted)}.badge{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 7px;font-size:10px;margin:5px 4px 0 0}.scenario{display:grid;grid-template-columns:1fr repeat(3,1fr);gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.scenario.head{color:var(--muted);font-size:10px;text-transform:uppercase}.transmission{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.step{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px}.step b{display:block;color:var(--cyan);margin-bottom:6px}.step p{font-size:11px;color:#b6c4cc;margin:0}.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.macro .box strong{display:block;font-size:21px;margin:5px 0}.reg{display:block;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none}.principle{border-left:3px solid var(--cyan);padding:10px 13px;background:var(--card2);border-radius:0 12px 12px 0;margin:8px 0}.page-break{height:0}.source{font-size:10px;color:var(--muted);margin-top:18px}.loading{padding:50px 0}.foot{border-top:1px solid var(--line);padding-top:20px;margin-top:24px;font-size:10px;color:var(--muted)}
@media(max-width:800px){.page{padding:22px}.top{display:block}.actions{margin-top:14px}.strip,.grid2,.grid3,.indices,.transmission,.macro{grid-template-columns:1fr 1fr}.indices .index-card:last-child,.transmission .step:last-child{grid-column:1/-1}.cover h1{font-size:44px}}
@media print{body{background:#fff;color:#111}.page{max-width:none;padding:0}.actions{display:none}.kpi,.box,.index-card,.vertical,.step{background:#fff;border-color:#bbb;break-inside:avoid;page-break-inside:avoid}.muted,.source,.formula,.rank small,.offer small,.step p,.foot{color:#555}.tag,.brand b,.step b{color:#087b88}.meter{background:#ddd}.meter i{background:#087b88}.page-break{break-before:page;page-break-before:always}.grid2,.grid3,.indices,.transmission,.macro,.offer,.rank,.scenario{break-inside:avoid;page-break-inside:avoid}.principle{background:#f4f7f8;color:#333;border-left-color:#087b88}@page{size:A4;margin:12mm}}
</style></head><body><main class="page"><div class="top"><div><div class="brand">RADAR <b>FIDC</b></div><div class="tag">Carta Mensal · Inteligência proprietária de mercado</div><div class="muted" style="font-size:11px;margin-top:5px">Daniel Alves Sousa · Metodologia Radar v1.0</div></div><div class="actions"><input class="select" id="month" type="month"><select class="select" id="market"><option value="ALL">3 mercados</option><option>FIDC</option><option>FIAGRO</option><option>FII</option></select><a class="btn" href="/intelligence.html">Inteligência de Mercado</a><button class="btn" onclick="window.print()">Salvar / imprimir PDF</button></div></div><div id="content" class="loading">Construindo carta mensal com dados oficiais…</div></main><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>Number.isFinite(v)?new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',notation:'compact',maximumFractionDigits:1}).format(v):'—',num=v=>Number(v).toLocaleString('pt-BR',{maximumFractionDigits:2}),pct=v=>Number.isFinite(v)?`${v>=0?'+':''}${v.toFixed(1).replace('.',',')}%`:'sem base comparável',monthBR=m=>/^\d{4}-\d{2}$/.test(m||'')?`${m.slice(5,7)}/${m.slice(0,4)}`:'—';
const q=new URLSearchParams(location.search),now=new Date(),prev=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()-1,1)),defaultMonth=prev.toISOString().slice(0,7);$('#month').value=q.get('month')||defaultMonth;$('#market').value=(q.get('market')||'ALL').toUpperCase();
async function getIntelligence(month){for(const url of ['/data/intelligence.json','/api/intelligence?month='+encodeURIComponent(month)]){try{const r=await fetch(url,{cache:url.startsWith('/data/')?'no-cache':'default'});if(r.ok){const d=await r.json();if(!d.error&&(url.includes('api')||d.month===month))return d}}catch{}}return null}
async function getMonthly(month,market){for(const url of [`/data/monthly-${month}-${market}.json`,`/api/monthly?month=${month}&market=${market}`]){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),url.startsWith('/api/')?45000:5000),r=await fetch(url,{cache:url.startsWith('/data/')?'no-cache':'default',signal:c.signal});clearTimeout(t);if(!r.ok)continue;const d=await r.json();if(!d.error)return d}catch{}}throw Error('Carta mensal temporariamente indisponível.')}
function idxCard(x){if(!x)return'';let score=Number.isFinite(x.score)?x.score:null;return `<div class="index-card"><div class="tag">${esc(x.code||'Índice')}</div><strong>${score===null?'—':score.toFixed(0)}/100</strong><div class="meter"><i style="width:${score??0}%"></i></div><span class="muted">${esc(x.interpretation||x.name||'')}</span></div>`}
function macroCard(label,z){return `<div class="box"><div class="tag">${esc(label)}</div><strong>${z?.latest?num(z.latest.value)+' '+esc(z.unit||''):'—'}</strong><span class="muted">${z?.latest?.date||'indisponível'}</span></div>`}
function leaders(rows){return(rows||[]).slice(0,7).map((x,i)=>`<div class="rank"><b>${i+1}</b><div>${esc(x.name)}<small>${money(x.volume)}</small></div><b>${x.count}</b></div>`).join('')||'<span class="muted">Sem coordenadores no período.</span>'}
function offers(rows){return(rows||[]).slice(0,7).map(x=>`<div class="offer"><div class="offer-head"><div><b>${esc(x.name)}</b><small>${esc(x.leader||'Coordenador não informado')} · ${x.count} registro(s)</small></div><b>${money(x.volume)}</b></div>${(x.records||[]).slice(0,4).map(r=>`<span class="badge">Reg. ${esc(r.registration||r.processNumber||'—')} · ${money(r.volume)}</span>`).join('')}</div>`).join('')||'<span class="muted">Sem operações com volume positivo.</span>'}
function scenarios(p){let s=p?.scenarios||[];return `<div class="scenario head"><span>Cenário</span><span>Volume anual</span><span>Ofertas</span><span>Ritmo mensal usado</span></div>${s.map(x=>`<div class="scenario"><b>${esc(x.label)}</b><span>${money(x.volume)}</span><span>${x.offers}</span><span>${money(x.monthlyVolumeAssumption)}</span></div>`).join('')}<p class="source">${esc(p?.method||'')}</p>`}
function vertical(key,v){let c=v.current,p=v.previous,ix=v.indices,base=p?.month?monthBR(p.month):'sem base';return `<section class="vertical"><div class="tag">${key} · ${monthBR(c.month)}</div><h2>${c.offers} ofertas · ${money(c.analyticalVolume)} analítico</h2><p class="muted">Volume oficial registrado: <b>${money(c.registeredVolume)}</b>${c.outliers?.length?` · ${c.outliers.length} outlier(s) isolado(s) da camada analítica`:''}</p>${c.outliers?.length?`<div class="principle"><b>Qualidade de dados.</b> ${c.outliers.map(x=>`${esc(x.name)}: ${money(x.volume)}`).join(' · ')}. O valor oficial é preservado; índices e cenários usam a leitura ajustada.</div>`:''}<div class="compare"><div><span class="muted">Quantidade vs. ${base}</span><b class="${v.changes.offersPct>=0?'positive':'negative'}">${pct(v.changes.offersPct)}</b></div><div><span class="muted">Volume analítico vs. ${base}</span><b class="${v.changes.analyticalVolumePct>=0?'positive':'negative'}">${pct(v.changes.analyticalVolumePct)}</b></div></div><div class="grid2" style="margin-top:14px"><div><h3>Leitura Radar</h3><ul>${(v.editorial||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h3>Índices da vertical</h3><div class="grid2">${idxCard(ix.offerPressure)}${idxCard(ix.pulse)}${idxCard(ix.concentration)}${idxCard(ix.breadth)}</div></div></div><div class="grid2"><div><h3>Coordenadores</h3>${leaders(c.topLeaders)}</div><div><h3>Maiores operações</h3>${offers(c.topOffers)}</div></div><h3>Cenários anualizados</h3>${scenarios(ix.projection)}<h3>Canal de transmissão</h3><div class="transmission">${(v.transmission||[]).map(x=>`<div class="step"><b>${esc(x.stage)}</b><p>${esc(x.text)}</p></div>`).join('')}</div></section>`}
async function load(){try{let month=$('#month').value,market=$('#market').value,[d,intel]=await Promise.all([getMonthly(month,market),getIntelligence(month)]),a=d.aggregate||{},c=a.current||{},ch=a.changes||{},ix=a.indices||{},label=market==='ALL'?'FIDC · FIAGRO · FII':market;document.title=`Carta Mensal Radar · ${label} · ${monthBR(month)}`;$('#content').className='';$('#content').innerHTML=`<section class="cover"><div class="tag">Carta Mensal Radar · ${monthBR(month)}</div><h1>${esc(d.houseView?.headline||'O mercado primário em perspectiva.')}</h1><p class="lead">Uma leitura autoral do mercado de crédito estruturado e fundos, conectando oferta primária, participantes, funding e regulação. Os números oficiais permanecem separados da interpretação Radar.</p></section><div class="strip"><div class="kpi"><div class="tag">Ofertas</div><strong>${c.offers??'—'}</strong><span class="muted">${pct(ch.offersPct)} vs. ${monthBR(a.previous?.month)}</span></div><div class="kpi"><div class="tag">Volume oficial</div><strong>${money(c.registeredVolume)}</strong><span class="muted">base CVM sem ajuste</span></div><div class="kpi"><div class="tag">Volume analítico</div><strong>${money(c.analyticalVolume)}</strong><span class="muted">${pct(ch.analyticalVolumePct)} vs. ${monthBR(a.previous?.month)}</span></div><div class="kpi"><div class="tag">Emissores</div><strong>${c.issuers??'—'}</strong><span class="muted">distintos</span></div><div class="kpi"><div class="tag">Coordenadores</div><strong>${c.leaders??'—'}</strong><span class="muted">distintos</span></div></div>${intel?.theses?.length?`<section class="section"><div class="tag">House View Radar</div><h2>${esc(intel.brief?.headline||'Teses do mês')}</h2><div class="grid2">${intel.theses.slice(0,2).map(t=>`<div class="box"><div class="tag">Tese Radar</div><h3>${esc(t.title)}</h3><p>${esc(t.statement)}</p><p class="muted"><b>O que invalida:</b> ${esc((t.invalidates||[]).join(' · '))}</p></div>`).join('')}</div></section>`:''}<section class="section"><div class="tag">Índices proprietários Radar</div><h2>Uma linguagem comum para medir o mercado</h2><div class="indices">${idxCard(ix.offerPressure)}${idxCard(ix.breadth)}${idxCard(ix.concentration)}${idxCard(ix.funding)}${idxCard(ix.pulse)}</div><p class="source">${esc(ix.methodology||'')}</p></section><div class="page-break"></div>${Object.entries(d.verticals||{}).map(([k,v])=>vertical(k,v)).join('<div class="page-break"></div>')}<section class="section"><div class="tag">Contexto macro</div><h2>Funding, crédito e inflação</h2><div class="macro">${macroCard('Selic',d.macro?.selic)}${macroCard('Inadimplência PJ',d.macro?.inadPJ)}${macroCard('Spread PJ',d.macro?.spreadPJ)}${macroCard('Saldo de crédito PJ',d.macro?.estoquePJ)}</div><div class="grid3" style="margin-top:12px"><div class="box"><div class="tag">ANBIMA</div><strong>${d.anbima?.selicEstimate?.value!=null?num(d.anbima.selicEstimate.value)+'%':'—'}</strong><span class="muted">Estimativa Selic</span></div><div class="box"><div class="tag">ANBIMA</div><strong>${d.anbima?.ipcaProjection?.value!=null?num(d.anbima.ipcaProjection.value)+'%':'—'}</strong><span class="muted">IPCA projetado</span></div><div class="box"><div class="tag">ANBIMA</div><strong>${d.anbima?.dollarSell?.value!=null?'R$ '+num(d.anbima.dollarSell.value):'—'}</strong><span class="muted">Dólar venda</span></div></div></section><section class="section"><div class="tag">Regulação</div><h2>Radar regulatório</h2><div class="grid2"><div class="box">${(d.regulatoryHighlights||[]).slice(0,5).map(x=>`<a class="reg" href="${esc(x.url)}"><b>${esc(x.title)}</b><br><span class="muted">Fonte oficial CVM</span></a>`).join('')||'Sem destaque.'}</div><div class="box"><div class="tag">Princípios da carta</div>${(d.houseView?.principles||[]).map(x=>`<div class="principle">${esc(x)}</div>`).join('')}</div></div></section><div class="principle" style="margin-top:18px"><b>Leitura importante:</b> o valor oficial e o valor analítico podem divergir quando a base contém um outlier estatístico. O Radar não altera nem apaga o dado oficial; apenas impede que ele distorça índices e cenários proprietários.</div><div class="foot"><b>Autoria:</b> Daniel Alves Sousa · Radar FIDC · Metodologia Radar v1.0<br><b>Metodologia:</b> ${esc(d.methodology||'')}<br><b>Nota:</b> Esta carta é informativa e analítica. Índices e cenários proprietários não constituem recomendação de investimento, previsão garantida, nem substituem documentos oficiais das ofertas.</div>`}catch(e){$('#content').innerHTML=`<h1>Carta indisponível</h1><p>${esc(e.message)}</p>`}}
$('#month').addEventListener('change',()=>{history.replaceState(null,'',`?month=${$('#month').value}&market=${$('#market').value}`);load()});$('#market').addEventListener('change',()=>{history.replaceState(null,'',`?month=${$('#month').value}&market=${$('#market').value}`);load()});load();
</script></body></html>
