<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar Regulatório</title><link rel="stylesheet" href="/report-theme.css"></head><body><main class="report"><div class="toolbar"><div class="brand">RADAR <b>REGULATÓRIO</b></div><div class="actions"><a class="btn" href="/research.html">Biblioteca</a><a class="btn" href="/regulatory.html">Execution</a><button class="btn primary" onclick="window.print()">Salvar PDF</button></div></div><div id="content">Carregando...</div></main><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function getData(){let r=await fetch('/data/intelligence.json',{cache:'default'});if(!r.ok)throw Error('Inteligência regulatória indisponível');return r.json()}
function live(x,i){return '<article class="offer-card"><div class="offer-head"><div class="offer-rank">'+(i+1)+'</div><div><h3>'+esc(x.title)+'</h3><div class="muted">'+esc(x.theme)+' · '+esc(x.execution?.status||'triagem')+'</div></div></div><p><b>Fato observado.</b> '+esc(x.observed)+'</p><p><b>Leitura operacional Radar.</b> '+esc(x.radarInterpretation)+'</p><div class="callout"><strong>Primeira ação</strong>'+esc(x.execution?.firstAction||'Abrir a fonte oficial e validar aplicabilidade.')+'</div></article>'}
async function load(){try{let d=await getData(),w=d.regulatoryExecution||{},liveItems=(w.live||[]).slice(0,3),steps=w.methodology?.steps||[];$('#content').innerHTML=
'<section class="page cover"><div><div class="eyebrow">RADAR REGULATÓRIO</div><h1>Da publicação oficial ao processo executável.</h1><p class="dek">Uma leitura de regulação orientada a implementação: fato, aplicabilidade, gap, processo, evidência e monitoramento.</p><div class="cover-meta"><div class="meta"><span>Destaques</span><b>'+liveItems.length+'</b></div><div class="meta"><span>Método</span><b>'+steps.length+' gates</b></div><div class="meta"><span>Escopo</span><b>CVM + ANBIMA</b></div></div></div><div class="cover-bottom"><div><strong>Daniel Alves Sousa</strong><br>Radar FIDC · Regulatory Execution</div><div>Fonte primeiro. Execução com evidência.</div></div></section>'+
'<section class="page"><div class="section-title"><h2>Destaques regulatórios</h2><p>Somente os movimentos com maior relevância operacional para ofertas, fundos e distribuição.</p></div><div class="panel">'+liveItems.map(live).join('')+'</div><div class="footer-mark"><span>RADAR REGULATÓRIO</span><span>02 · Destaques</span></div></section>'+
'<section class="page"><div class="section-title"><h2>Como a exigência vira processo</h2><p>O Radar não transforma notícia em obrigação. A execução passa por gates objetivos.</p></div><div class="timeline">'+steps.map(s=>'<div class="timeline-row"><b>'+esc(s.order+' · '+s.label)+'</b><p><strong>Pergunta:</strong> '+esc(s.question)+'<br><strong>Saída:</strong> '+esc(s.output)+'</p></div>').join('')+'</div><div class="callout amber" style="margin-top:18px"><strong>Guardrail</strong>'+esc(w.methodology?.guardrail||'Obrigação expressa e interpretação operacional permanecem separadas.')+'</div><div class="footer-mark"><span>RADAR REGULATÓRIO</span><span>03 · Método</span></div></section>'+
'<section class="page"><div class="section-title"><h2>Agenda de implementação</h2><p>O material regulatório termina em ação, evidência e monitoramento — não em resumo de norma.</p></div><div class="grid2"><div class="panel"><div class="tag">Processos</div><h3>O que revisar</h3><ul class="list">'+liveItems.flatMap(x=>x.execution?.checkpoints||[]).slice(0,8).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><div class="panel"><div class="tag">Evidências</div><h3>O que precisa ficar provado</h3><ul class="list">'+liveItems.flatMap(x=>x.execution?.evidence||[]).slice(0,8).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></div><div class="panel soft" style="margin-top:14px"><div class="tag">Áreas envolvidas</div><p>'+esc([...new Set(liveItems.flatMap(x=>x.execution?.owners||[]))].join(' · ')||'Definir após validação de aplicabilidade.')+'</p></div><p class="source">Este material é analítico e operacional. Não substitui jurídico/compliance. A obrigação deve ser confirmada na fonte oficial e na aplicabilidade ao caso concreto.</p><div class="footer-mark"><span>RADAR REGULATÓRIO</span><span>04 · Execução</span></div></section>'}catch(e){$('#content').innerHTML='<section class="page"><h1>Material indisponível</h1><p>'+esc(e.message)+'</p></section>'}}load();
</script></body></html>
