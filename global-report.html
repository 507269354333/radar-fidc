<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar Global</title><link rel="stylesheet" href="/report-theme.css"></head><body><main class="report"><div class="toolbar"><div class="brand">RADAR <b>GLOBAL</b></div><div class="actions"><a class="btn" href="/research.html">Biblioteca</a><button class="btn primary" onclick="window.print()">Salvar PDF</button></div></div><div id="content">Carregando...</div></main><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>Number.isFinite(v)?new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',notation:'compact',maximumFractionDigits:1}).format(v):'—',dateBR=v=>{let m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[3]+'/'+m[2]+'/'+m[1]:'—'};
async function get(u){let r=await fetch(u,{cache:'default'});if(!r.ok)throw Error('Falha em '+u);return r.json()}
function group(rows){const m=new Map();for(const x of rows||[]){const k=(x.name||'').trim(),g=m.get(k)||{name:k,leader:x.leader,total:0,count:0};g.count++;if(Number.isFinite(x.volume))g.total+=x.volume;m.set(k,g)}return[...m.values()].sort((a,b)=>b.total-a.total)}
async function load(){try{let [w,i,m]=await Promise.all([get('/data/weekly-ALL.json'),get('/data/intelligence.json'),get('/data/macro-ticker.json')]),c=w.current||{},ops=group(c.topOffers||[]).slice(0,5);$('#content').innerHTML=
'<section class="page cover"><div><div class="eyebrow">RADAR GLOBAL · RESUMO EXECUTIVO</div><h1>'+esc(i.brief?.headline||'Mercado estruturado em perspectiva')+'</h1><p class="dek">FIDC, FIAGRO e FII em uma única leitura: ofertas relevantes, direção dos índices, funding e regulação.</p><div class="cover-meta"><div class="meta"><span>Semana</span><b>'+dateBR(c.period?.start)+' - '+dateBR(c.period?.end)+'</b></div><div class="meta"><span>Ofertas</span><b>'+esc(c.offers??'—')+'</b></div><div class="meta"><span>Volume</span><b>'+money(c.volume)+'</b></div></div></div><div class="cover-bottom"><div><strong>Daniel Alves Sousa</strong><br>Radar FIDC · Resumo Global</div><div>Mercado · Regulação · Inteligência</div></div></section>'+
'<section class="page"><div class="section-title"><h2>Três mercados, uma leitura</h2><p>Direção relativa de cada vertical a partir dos índices proprietários Radar.</p></div><div class="grid3">'+(i.directions||[]).map(d=>'<div class="panel"><div class="tag">'+esc(d.market)+'</div><h3>'+esc(d.headline)+'</h3><p>'+esc(d.statement)+'</p><p><b>IROP</b> '+(Number.isFinite(d.scores?.IROP)?d.scores.IROP.toFixed(0):'—')+' · <b>IRPM</b> '+(Number.isFinite(d.scores?.IRPM)?d.scores.IRPM.toFixed(0):'—')+'</p></div>').join('')+'</div><div class="panel soft" style="margin-top:14px"><div class="tag">House View</div><h3>'+esc((i.theses||[])[0]?.title||'Leitura em atualização')+'</h3><p>'+esc((i.theses||[])[0]?.statement||'')+'</p></div><div class="footer-mark"><span>RADAR GLOBAL</span><span>02 · Direção</span></div></section>'+
'<section class="page"><div class="section-title"><h2>Movimentos que importam</h2><p>Principais ofertas públicas por volume; a base completa fica no portal.</p></div><div class="panel">'+ops.map((x,n)=>'<article class="offer-card"><div class="offer-head"><div class="offer-rank">'+(n+1)+'</div><div><h3>'+esc(x.name)+'</h3><div class="muted">'+esc(x.leader||'Coordenador não informado')+' · '+x.count+' registro(s)</div></div><div class="volume">'+money(x.total)+'</div></div></article>').join('')+'</div><div class="grid2" style="margin-top:14px"><div class="panel"><div class="tag">Concentração</div><h3>'+(Number.isFinite(c.top3Concentration)?(c.top3Concentration*100).toFixed(1).replace('.',',')+'%':'—')+'</h3><p class="muted">Participação dos três coordenadores mais presentes na semana.</p></div><div class="panel"><div class="tag">Investidor profissional</div><h3>'+(Number.isFinite(c.professionalShare)?(c.professionalShare*100).toFixed(1).replace('.',',')+'%':'—')+'</h3><p class="muted">Parcela das ofertas com público profissional.</p></div></div><div class="footer-mark"><span>RADAR GLOBAL</span><span>03 · Ofertas</span></div></section>'+
'<section class="page"><div class="section-title"><h2>Macro, funding e regulação</h2><p>Fechamento para transformar movimento de mercado em agenda.</p></div><div class="grid3">'+(m.items||[]).filter(x=>['SELIC','IPCA','USD/BRL','DBGG/PIB','IRF-M','IMA-B'].includes(x.label)).slice(0,6).map(x=>'<div class="panel"><div class="tag">'+esc(x.label)+'</div><h3>'+esc(x.display)+'</h3><p class="muted">'+esc(x.fullLabel||x.category||'')+'</p></div>').join('')+'</div><div class="panel soft" style="margin-top:14px"><div class="tag">Regulador em foco</div>'+(w.regulatoryHighlights||[]).slice(0,3).map(x=>'<p><b>'+esc(x.title)+'</b><br><span class="muted">Fonte oficial CVM</span></p>').join('')+'</div><div class="callout amber" style="margin-top:14px"><strong>Próxima leitura</strong>'+esc((i.brief?.watch||[])[0]||'Monitorar pipeline, funding e mudanças regulatórias com capacidade de alterar processo ou absorção de capital.')+'</div><p class="source">Resumo executivo. Dados completos, metodologia, documentos e histórico permanecem disponíveis no portal Radar.</p><div class="footer-mark"><span>RADAR GLOBAL</span><span>04 · Fechamento</span></div></section>'}catch(e){$('#content').innerHTML='<section class="page"><h1>Material indisponível</h1><p>'+esc(e.message)+'</p></section>'}}load();
</script></body></html>
